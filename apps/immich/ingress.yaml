apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  annotations:
    cert-manager.io/cluster-issuer: greiner-ca-issuer
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - photos.greiner.home
      secretName: immich-tls
  rules:
    - host: photos.greiner.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 80