apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
        - name: redis
          image: docker.io/valkey/valkey:9@sha256:169567d6288e5f08aa141847c0c3e0864a32e727682ca6f052a20567c7103ef8
          ports:
            - containerPort: 6379