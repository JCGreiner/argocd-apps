---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homeassistant-tls
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: homeassistant-tls
  dnsNames:
    - ha.greiner.home
  issuerRef:
    kind: ClusterIssuer
    name: greiner-ca-issuer
