# ============================================================
# SolarEdge SE3000H derived sensors
# ============================================================
- sensor:
    # ----------------------------------------------------------
    # AC
    # ----------------------------------------------------------
    - name: "SolarEdge AC Power"
      unique_id: solaredge_ac_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set value = states('sensor.solaredge_ac_power_raw') | float(0) %}
        {% set sf = states('sensor.solaredge_ac_power_scale') | int(0) %}
        {{ (value * (10 ** sf)) | round(0) }}

    - name: "SolarEdge AC Current"
      unique_id: solaredge_ac_current
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      state: >
        {% set value = states('sensor.solaredge_ac_current_raw') | float(0) %}
        {% set sf = states('sensor.solaredge_ac_current_scale') | int(0) %}
        {{ (value * (10 ** sf)) | round(2) }}

    - name: "SolarEdge AC Voltage"
      unique_id: solaredge_ac_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      state: >
        {% set value = states('sensor.solaredge_ac_voltage_raw') | float(0) %}
        {% set sf = states('sensor.solaredge_ac_voltage_scale') | int(0) %}
        {{ (value * (10 ** sf)) | round(1) }}

    - name: "SolarEdge AC Frequency"
      unique_id: solaredge_ac_frequency
      unit_of_measurement: "Hz"
      state_class: measurement
      state: >
        {% set value = states('sensor.solaredge_ac_frequency_raw') | float(0) %}
        {% set sf = states('sensor.solaredge_ac_frequency_scale') | int(0) %}
        {{ (value * (10 ** sf)) | round(2) }}

    # ----------------------------------------------------------
    # DC
    # ----------------------------------------------------------
    - name: "SolarEdge DC Power"
      unique_id: solaredge_dc_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set value = states('sensor.solaredge_dc_power_raw') | float(0) %}
        {% set sf = states('sensor.solaredge_dc_power_scale') | int(0) %}
        {{ (value * (10 ** sf)) | round(0) }}

    - name: "SolarEdge DC Current"
      unique_id: solaredge_dc_current
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      state: >
        {% set value = states('sensor.solaredge_dc_current_raw') | float(0) %}
        {% set sf = states('sensor.solaredge_dc_current_scale') | int(0) %}
        {{ (value * (10 ** sf)) | round(2) }}

    - name: "SolarEdge DC Voltage"
      unique_id: solaredge_dc_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      state: >
        {% set value = states('sensor.solaredge_dc_voltage_raw') | float(0) %}
        {% set sf = states('sensor.solaredge_dc_voltage_scale') | int(0) %}
        {{ (value * (10 ** sf)) | round(1) }}

    # ----------------------------------------------------------
    # Lifetime / total solar energy
    # ----------------------------------------------------------
    - name: "SolarEdge Solar Energy"
      unique_id: solaredge_solar_energy
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:solar-power
      state: >
        {% set raw = states('sensor.solaredge_lifetime_energy_raw') %}
        {% set sf = states('sensor.solaredge_lifetime_energy_scale') %}

        {% if is_number(raw) and is_number(sf) %}
          {% set value = raw | float %}
          {% set scale = sf | int %}

          {% if -10 <= scale <= 10 %}
            {{ (value * (10 ** scale) / 1000) | round(3) }}
          {% else %}
            {{ none }}
          {% endif %}
        {% else %}
          {{ none }}
        {% endif %}

    # ----------------------------------------------------------
    # Temperature
    # ----------------------------------------------------------
    - name: "SolarEdge Temperature"
      unique_id: solaredge_temperature
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: >
        {% set value = states('sensor.solaredge_temperature_raw') | float(0) %}
        {% set sf = states('sensor.solaredge_temperature_scale') | int(0) %}
        {{ (value * (10 ** sf)) | round(1) }}

    # ----------------------------------------------------------
    # Status
    # ----------------------------------------------------------
    - name: "SolarEdge Operating Status"
      unique_id: solaredge_operating_status
      state: >
        {% set status = states('sensor.solaredge_status') | int(-1) %}
        {% set statuses = {
          1: 'Off',
          2: 'Sleeping',
          3: 'Starting',
          4: 'Producing',
          5: 'Throttled',
          6: 'Shutting down',
          7: 'Fault',
          8: 'Standby',
          65534: 'Idle (no data)',
          65535: 'Idle (no data)'
        } %}
        {{ statuses.get(status, 'Unknown (' ~ status ~ ')') }}

# ============================================================
# Virtual battery simulation
# ============================================================

- sensor:

    # ----------------------------------------------------------
    # Normalized source power
    # ----------------------------------------------------------

    - name: "Virtual Solar Power"
      unique_id: virtual_solar_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {{ states('sensor.solaredge_ac_power') | float(0) | max(0) }}

    - name: "Virtual Home Power"
      unique_id: virtual_home_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {{ (states('sensor.slimmelezer_power_consumed') | float(0) * 1000) | max(0) }}

    # ----------------------------------------------------------
    # Solar surplus / deficit
    # Positive = excess solar
    # Negative = house needs grid/battery power
    # ----------------------------------------------------------

    - name: "Virtual Solar Surplus"
      unique_id: virtual_solar_surplus
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set solar = states('sensor.solaredge_ac_power') | float(0) | max(0) %}
        {% set home = states('sensor.slimmelezer_power_consumed') | float(0) * 1000 %}
        {{ solar - home }}

    # ----------------------------------------------------------
    # Battery charge power
    # ----------------------------------------------------------

    - name: "Virtual Battery Charge Power"
      unique_id: virtual_battery_charge_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set solar = states('sensor.solaredge_ac_power') | float(0) | max(0) %}
        {% set home = states('sensor.slimmelezer_power_consumed') | float(0) * 1000 %}
        {% set surplus = [solar - home, 0] | max %}

        {% set soc = states('input_number.virtual_battery_soc') | float(50) %}
        {% set capacity = states('input_number.virtual_battery_capacity') | float(10) %}
        {% set max_charge = states('input_number.virtual_battery_max_charge') | float(3) * 1000 %}
        {% set efficiency = states('input_number.virtual_battery_charge_efficiency') | float(95) / 100 %}

        {% set stored_energy = capacity * soc / 100 %}
        {% set remaining_energy = [capacity - stored_energy, 0] | max %}

        {% if remaining_energy > 0 and efficiency > 0 %}
          {% set capacity_limit = remaining_energy * 1000 / efficiency / 60 %}
          {{ [surplus, max_charge, capacity_limit] | min }}
        {% else %}
          0
        {% endif %}

    # ----------------------------------------------------------
    # Battery discharge power
    # ----------------------------------------------------------

    - name: "Virtual Battery Discharge Power"
      unique_id: virtual_battery_discharge_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set solar = states('sensor.solaredge_ac_power') | float(0) | max(0) %}
        {% set home = states('sensor.slimmelezer_power_consumed') | float(0) * 1000 %}
        {% set deficit = [home - solar, 0] | max %}

        {% set soc = states('input_number.virtual_battery_soc') | float(50) %}
        {% set capacity = states('input_number.virtual_battery_capacity') | float(10) %}
        {% set max_discharge = states('input_number.virtual_battery_max_discharge') | float(3) * 1000 %}
        {% set efficiency = states('input_number.virtual_battery_discharge_efficiency') | float(95) / 100 %}
        {% set minimum_soc = 10 %}

        {% set stored_energy = capacity * soc / 100 %}
        {% set usable_energy = [stored_energy - capacity * minimum_soc / 100, 0] | max %}

        {% if usable_energy > 0 and efficiency > 0 %}
          {% set capacity_limit = usable_energy * 1000 * efficiency / 60 %}
          {{ [deficit, max_discharge, capacity_limit] | min }}
        {% else %}
          0
        {% endif %}

    # ----------------------------------------------------------
    # Net battery power
    #
    # Positive = charging
    # Negative = discharging
    # ----------------------------------------------------------

    - name: "Virtual Battery Power"
      unique_id: virtual_battery_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set charge = states('sensor.virtual_battery_charge_power') | float(0) %}
        {% set discharge = states('sensor.virtual_battery_discharge_power') | float(0) %}
        {{ charge - discharge }}

    # ----------------------------------------------------------
    # Simulated grid export
    # ----------------------------------------------------------

    - name: "Virtual Grid Export Power"
      unique_id: virtual_grid_export_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set solar = states('sensor.solaredge_ac_power') | float(0) | max(0) %}
        {% set home = states('sensor.slimmelezer_power_consumed') | float(0) * 1000 %}
        {% set surplus = [solar - home, 0] | max %}
        {% set charge = states('sensor.virtual_battery_charge_power') | float(0) %}
        {{ [surplus - charge, 0] | max }}

    # ----------------------------------------------------------
    # Simulated grid import
    # ----------------------------------------------------------

    - name: "Virtual Grid Import Power"
      unique_id: virtual_grid_import_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set solar = states('sensor.solaredge_ac_power') | float(0) | max(0) %}
        {% set home = states('sensor.slimmelezer_power_consumed') | float(0) * 1000 %}
        {% set deficit = [home - solar, 0] | max %}
        {% set discharge = states('sensor.virtual_battery_discharge_power') | float(0) %}
        {{ [deficit - discharge, 0] | max }}

    # ----------------------------------------------------------
    # Battery state of charge
    # ----------------------------------------------------------

    - name: "Virtual Battery State of Charge"
      unique_id: virtual_battery_state_of_charge
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      state: >
        {{ states('input_number.virtual_battery_soc') | float(50) | round(2) }}