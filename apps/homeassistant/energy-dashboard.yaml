title: Energy + Battery

views:
  - title: Energy + Battery
    path: overview
    type: sections
    max_columns: 3

    sections:

      # ========================================================
      # Current Power
      # ========================================================
      - type: grid
        cards:
          - type: heading
            heading: Current Power
            heading_style: title

          - type: entities
            entities:
              - entity: sensor.virtual_solar_power
                name: Solar Production
              - entity: sensor.virtual_home_power
                name: Home Consumption
              - entity: sensor.virtual_solar_surplus
                name: Solar Surplus
              - entity: sensor.virtual_battery_power
                name: Battery Power
              - entity: sensor.virtual_grid_import_power
                name: Grid Import
              - entity: sensor.virtual_grid_export_power
                name: Grid Export

      # ========================================================
      # Battery
      # ========================================================
      - type: grid
        cards:
          - type: heading
            heading: Simulated Battery
            heading_style: title

          - type: gauge
            entity: sensor.virtual_battery_state_of_charge
            name: State of Charge
            min: 10
            max: 100
            severity:
              red: 10
              yellow: 30
              green: 60

          - type: entities
            entities:
              - entity: sensor.virtual_battery_charge_power
                name: Charging
              - entity: sensor.virtual_battery_discharge_power
                name: Discharging
              - entity: input_number.virtual_battery_capacity
                name: Capacity
              - entity: input_number.virtual_battery_max_charge
                name: Max Charge
              - entity: input_number.virtual_battery_max_discharge
                name: Max Discharge

      # ========================================================
      # Today's Energy
      # ========================================================
      - type: grid
        cards:
          - type: heading
            heading: Today
            heading_style: title

          - type: entities
            entities:
              - entity: sensor.virtual_battery_charged_today
                name: Battery Charged
              - entity: sensor.virtual_battery_discharged_today
                name: Battery Discharged
              - entity: sensor.virtual_grid_import_today
                name: Grid Import
              - entity: sensor.virtual_grid_export_today
                name: Grid Export

      # ========================================================
      # Power History
      # ========================================================
      - type: grid
        cards:
          - type: heading
            heading: Power Flow
            heading_style: title

          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.virtual_solar_power
                name: Solar
              - entity: sensor.virtual_home_power
                name: Home
              - entity: sensor.virtual_battery_power
                name: Battery
              - entity: sensor.virtual_grid_import_power
                name: Grid Import
              - entity: sensor.virtual_grid_export_power
                name: Grid Export

      # ========================================================
      # Battery SOC History
      # ========================================================
      - type: grid
        cards:
          - type: heading
            heading: Battery State of Charge
            heading_style: title

          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.virtual_battery_state_of_charge
                name: Battery SOC