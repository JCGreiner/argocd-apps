title: Energy
views:
  - title: Energy
    path: overview
    icon: mdi:lightning-bolt
    cards:

      # --------------------------------------------------------
      # Current power flow
      # --------------------------------------------------------
      - type: energy-distribution
        link_dashboard: false
        entities:
          solar:
            - sensor.virtual_solar_power
          grid:
            - sensor.virtual_grid_import_power
            - sensor.virtual_grid_export_power
          battery:
            - sensor.virtual_battery_power
          home:
            - sensor.virtual_home_power

      # --------------------------------------------------------
      # Current values
      # --------------------------------------------------------
      - type: entities
        title: Current Power
        entities:
          - entity: sensor.virtual_solar_power
            name: Solar Production

          - entity: sensor.virtual_home_power
            name: Home Consumption

          - entity: sensor.virtual_solar_surplus
            name: Solar Surplus

          - entity: sensor.virtual_battery_power
            name: Battery Power

          - entity: sensor.virtual_grid_import_power
            name: Grid Import

          - entity: sensor.virtual_grid_export_power
            name: Grid Export

      # --------------------------------------------------------
      # Battery
      # --------------------------------------------------------
      - type: gauge
        entity: sensor.virtual_battery_state_of_charge
        name: Simulated Battery
        min: 10
        max: 100
        severity:
          red: 10
          yellow: 30
          green: 60

      - type: entities
        title: Simulated Battery
        entities:
          - entity: sensor.virtual_battery_state_of_charge
            name: State of Charge

          - entity: sensor.virtual_battery_charge_power
            name: Charging

          - entity: sensor.virtual_battery_discharge_power
            name: Discharging

          - entity: sensor.virtual_battery_energy_charged
            name: Energy Charged

          - entity: sensor.virtual_battery_energy_discharged
            name: Energy Discharged

      # --------------------------------------------------------
      # Today's energy
      # --------------------------------------------------------
      - type: entities
        title: Today
        entities:
          - entity: sensor.virtual_battery_charged_today
            name: Battery Charged

          - entity: sensor.virtual_battery_discharged_today
            name: Battery Discharged

          - entity: sensor.virtual_grid_import_today
            name: Grid Import

          - entity: sensor.virtual_grid_export_today
            name: Grid Export

      # --------------------------------------------------------
      # Power history
      # --------------------------------------------------------
      - type: history-graph
        title: Power Flow - Last 24 Hours
        hours_to_show: 24
        entities:
          - entity: sensor.virtual_solar_power
            name: Solar

          - entity: sensor.virtual_home_power
            name: Home

          - entity: sensor.virtual_battery_power
            name: Battery

          - entity: sensor.virtual_grid_import_power
            name: Grid Import

          - entity: sensor.virtual_grid_export_power
            name: Grid Export

      # --------------------------------------------------------
      # Battery SOC
      # --------------------------------------------------------
      - type: history-graph
        title: Simulated Battery SOC
        hours_to_show: 24
        entities:
          - entity: sensor.virtual_battery_state_of_charge
            name: Battery SOC

      # --------------------------------------------------------
      # Daily energy
      # --------------------------------------------------------
      - type: history-graph
        title: Daily Grid Energy
        hours_to_show: 168
        entities:
          - entity: sensor.virtual_grid_import_today
            name: Grid Import

          - entity: sensor.virtual_grid_export_today
            name: Grid Export

      - type: history-graph
        title: Daily Battery Energy
        hours_to_show: 168
        entities:
          - entity: sensor.virtual_battery_charged_today
            name: Battery Charged

          - entity: sensor.virtual_battery_discharged_today
            name: Battery Discharged