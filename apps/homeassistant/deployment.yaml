---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1

  selector:
    matchLabels:
      app: homeassistant

  template:
    metadata:
      labels:
        app: homeassistant

    spec:
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:stable

          ports:
            - name: http
              containerPort: 8123

          volumeMounts:
            - name: config
              mountPath: /config

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config