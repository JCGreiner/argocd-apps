---
generatorOptions:
  disableNameSuffixHash: false
configMapGenerator:
  - name: homeassistant-config
    files:
      - configuration.yaml
      - solaredge-template.yaml
      - automations.yaml
      - scripts.yaml
      - scenes.yaml
      - solar-dashboard.yaml

resources:
  - certificate.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml