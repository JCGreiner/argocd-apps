title: Solar + Battery

views:

  - title: Overview
    path: overview
    icon: mdi:solar-power

    cards:

      # ======================================================
      # Current power
      # ======================================================

      - type: entities
        title: Current Energy Flow
        entities:

          - entity: sensor.virtual_solar_power
            name: Solar Production

          - entity: sensor.virtual_home_power
            name: Home Consumption

          - entity: sensor.virtual_solar_surplus
            name: Solar Surplus

          - entity: sensor.virtual_battery_power
            name: Battery Power

          - entity: sensor.virtual_grid_import_power
            name: Simulated Grid Import

          - entity: sensor.virtual_grid_export_power
            name: Simulated Grid Export


      # ======================================================
      # Battery
      # ======================================================

      - type: gauge
        entity: sensor.virtual_battery_state_of_charge
        name: Virtual Battery
        min: 10
        max: 100
        severity:
          red: 10
          yellow: 30
          green: 60


      - type: entities
        title: Battery
        entities:

          - entity: sensor.virtual_battery_state_of_charge
            name: State of Charge

          - entity: sensor.virtual_battery_charge_power
            name: Charging

          - entity: sensor.virtual_battery_discharge_power
            name: Discharging

          - entity: input_number.virtual_battery_capacity
            name: Capacity

          - entity: input_number.virtual_battery_max_charge
            name: Max Charge

          - entity: input_number.virtual_battery_max_discharge
            name: Max Discharge

          - entity: input_number.virtual_battery_charge_efficiency
            name: Charge Efficiency

          - entity: input_number.virtual_battery_discharge_efficiency
            name: Discharge Efficiency


      # ======================================================
      # Today's simulated energy
      # ======================================================

      - type: entities
        title: Today
        entities:

          - entity: sensor.virtual_battery_charged_today
            name: Battery Charged

          - entity: sensor.virtual_battery_discharged_today
            name: Battery Discharged

          - entity: sensor.virtual_grid_import_today
            name: Simulated Grid Import

          - entity: sensor.virtual_grid_export_today
            name: Simulated Grid Export


      # ======================================================
      # Power history
      # ======================================================

      - type: history-graph
        title: Power Flow - Last 24 Hours
        hours_to_show: 24
        entities:

          - entity: sensor.virtual_solar_power
            name: Solar

          - entity: sensor.virtual_home_power
            name: Home

          - entity: sensor.virtual_battery_power
            name: Battery

          - entity: sensor.virtual_grid_import_power
            name: Grid Import

          - entity: sensor.virtual_grid_export_power
            name: Grid Export


      # ======================================================
      # Battery SOC history
      # ======================================================

      - type: history-graph
        title: Battery SOC - Last 24 Hours
        hours_to_show: 24
        entities:

          - entity: sensor.virtual_battery_state_of_charge
            name: Battery SOC