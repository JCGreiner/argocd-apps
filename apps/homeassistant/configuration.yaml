# Loads default set of integrations. Do not remove.
default_config:

# HTTP / reverse proxy configuration
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.42.0.0/24

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# SolarEdge SE3000H - SunSpec Modbus TCP
modbus:
  - name: solaredge
    type: tcp
    host: 192.168.1.161
    port: 1502
    delay: 0
    timeout: 5
    message_wait_milliseconds: 50

    sensors:

      # ------------------------------------------------------------
      # SunSpec inverter identification
      # ------------------------------------------------------------

      - name: "SolarEdge SunSpec Model"
        unique_id: solaredge_sunspec_model
        address: 68
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 300

      # ------------------------------------------------------------
      # AC measurements
      #
      # SolarEdge SunSpec:
      # 40071 AC current
      # 40075 current SF
      # 40076-40081 AC voltages
      # 40082 voltage SF
      # 40083 AC power
      # 40084 power SF
      # 40085 frequency
      # 40086 frequency SF
      # ------------------------------------------------------------

      - name: "SolarEdge AC Current Raw"
        unique_id: solaredge_ac_current_raw
        address: 71
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 10

      - name: "SolarEdge AC Current Scale"
        unique_id: solaredge_ac_current_sf
        address: 75
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Voltage Raw"
        unique_id: solaredge_ac_voltage_raw
        address: 79
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 10

      - name: "SolarEdge AC Voltage Scale"
        unique_id: solaredge_ac_voltage_sf
        address: 82
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Power Raw"
        unique_id: solaredge_ac_power_raw
        address: 83
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 10

      - name: "SolarEdge AC Power Scale"
        unique_id: solaredge_ac_power_sf
        address: 84
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Frequency Raw"
        unique_id: solaredge_ac_frequency_raw
        address: 85
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 10

      - name: "SolarEdge AC Frequency Scale"
        unique_id: solaredge_ac_frequency_sf
        address: 86
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      # ------------------------------------------------------------
      # Lifetime energy
      #
      # 40093-40094 = uint32 Wh
      # 40095       = signed scale factor
      # ------------------------------------------------------------

      - name: "SolarEdge Lifetime Energy Raw"
        unique_id: solaredge_lifetime_energy_raw
        address: 92
        input_type: holding
        data_type: uint32
        slave: 1
        scan_interval: 60

      - name: "SolarEdge Lifetime Energy Scale"
        unique_id: solaredge_lifetime_energy_sf
        address: 94
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      # ------------------------------------------------------------
      # DC measurements
      # ------------------------------------------------------------

      - name: "SolarEdge DC Current Raw"
        unique_id: solaredge_dc_current_raw
        address: 95
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 10

      - name: "SolarEdge DC Current Scale"
        unique_id: solaredge_dc_current_sf
        address: 96
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge DC Voltage Raw"
        unique_id: solaredge_dc_voltage_raw
        address: 97
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 10

      - name: "SolarEdge DC Voltage Scale"
        unique_id: solaredge_dc_voltage_sf
        address: 98
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge DC Power Raw"
        unique_id: solaredge_dc_power_raw
        address: 99
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 10

      - name: "SolarEdge DC Power Scale"
        unique_id: solaredge_dc_power_sf
        address: 100
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      # ------------------------------------------------------------
      # Temperature / status
      # ------------------------------------------------------------

      - name: "SolarEdge Temperature Raw"
        unique_id: solaredge_temperature_raw
        address: 102
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30

      - name: "SolarEdge Temperature Scale"
        unique_id: solaredge_temperature_sf
        address: 105
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge Status"
        unique_id: solaredge_status
        address: 106
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30

      - name: "SolarEdge Vendor Status"
        unique_id: solaredge_vendor_status
        address: 107
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30

# Derived SolarEdge sensors
template: !include solaredge-template.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
metadata:
  name: