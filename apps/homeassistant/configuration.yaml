# Loads default set of integrations. Do not remove.
default_config:

# HTTP / reverse proxy configuration
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.42.0.0/24

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# SolarEdge SE3000H - SunSpec Modbus TCP diagnostic
modbus:
  - name: solaredge
    type: tcp
    host: 192.168.1.161
    port: 1502
    delay: 100
    timeout: 10
    message_wait_milliseconds: 200

    sensors:
      # ==========================================================
      # SunSpec model identification
      # ==========================================================
      - name: "SolarEdge SunSpec Model"
        unique_id: solaredge_sunspec_model
        address: 68
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60

      # ==========================================================
      # AC measurements
      # ==========================================================
      - name: "SolarEdge AC Current Raw"
        unique_id: solaredge_ac_current_raw
        address: 71
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Current Scale"
        unique_id: solaredge_ac_current_scale
        address: 75
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Voltage Raw"
        unique_id: solaredge_ac_voltage_raw
        address: 79
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Voltage Scale"
        unique_id: solaredge_ac_voltage_scale
        address: 82
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Power Raw"
        unique_id: solaredge_ac_power_raw
        address: 83
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Power Scale"
        unique_id: solaredge_ac_power_scale
        address: 84
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Frequency Raw"
        unique_id: solaredge_ac_frequency_raw
        address: 85
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Frequency Scale"
        unique_id: solaredge_ac_frequency_scale
        address: 86
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30

      # ==========================================================
      # Apparent power / reactive power / power factor
      # ==========================================================
      - name: "SolarEdge Apparent Power Raw"
        unique_id: solaredge_apparent_power_raw
        address: 87
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Apparent Power Scale"
        unique_id: solaredge_apparent_power_scale
        address: 88
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Reactive Power Raw"
        unique_id: solaredge_reactive_power_raw
        address: 89
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Reactive Power Scale"
        unique_id: solaredge_reactive_power_scale
        address: 90
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Power Factor Raw"
        unique_id: solaredge_power_factor_raw
        address: 91
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Power Factor Scale"
        unique_id: solaredge_power_factor_scale
        address: 92
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30

      # ==========================================================
      # Lifetime AC energy
      #
      # 93-94 = uint32 accumulated energy
      # 95    = signed scale factor
      # ==========================================================
      - name: "SolarEdge Lifetime Energy Raw"
        unique_id: solaredge_lifetime_energy_raw
        address: 93
        input_type: holding
        data_type: uint32
        slave: 1
        swap: word
        scan_interval: 60
      - name: "SolarEdge Lifetime Energy Scale"
        unique_id: solaredge_lifetime_energy_scale
        address: 95
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      # ==========================================================
      # DC measurements
      # ==========================================================
      - name: "SolarEdge DC Current Raw"
        unique_id: solaredge_dc_current_raw
        address: 96
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Current Scale"
        unique_id: solaredge_dc_current_scale
        address: 97
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Voltage Raw"
        unique_id: solaredge_dc_voltage_raw
        address: 98
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Voltage Scale"
        unique_id: solaredge_dc_voltage_scale
        address: 99
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Power Raw"
        unique_id: solaredge_dc_power_raw
        address: 100
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Power Scale"
        unique_id: solaredge_dc_power_scale
        address: 101
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30

      # ==========================================================
      # Temperature
      # ==========================================================
      - name: "SolarEdge Temperature Raw"
        unique_id: solaredge_temperature_raw
        address: 102
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60
      - name: "SolarEdge Temperature Scale"
        unique_id: solaredge_temperature_scale
        address: 105
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      # ==========================================================
      # Status
      # ==========================================================
      - name: "SolarEdge Status"
        unique_id: solaredge_status
        address: 106
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60
      - name: "SolarEdge Vendor Status"
        unique_id: solaredge_vendor_status
        address: 107
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60

# Dashboards
lovelace:
  resource_mode: yaml
  dashboards:
    solar-power:
      mode: yaml
      filename: solar-dashboard.yaml
      title: Solar
      icon: mdi:solar-power
      show_in_sidebar: true

# Derived SolarEdge sensors
template: !include solaredge-template.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
