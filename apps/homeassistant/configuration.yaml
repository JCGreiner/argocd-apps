# Loads default set of integrations. Do not remove.
default_config:

# HTTP / reverse proxy configuration
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.42.0.0/24

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# SolarEdge SE3000H - SunSpec Modbus TCP diagnostic
modbus:
  - name: solaredge
    type: tcp
    host: 192.168.1.161
    port: 1502
    delay: 100
    timeout: 10
    message_wait_milliseconds: 200

    sensors:
      # ==========================================================
      # SunSpec model identification
      # ==========================================================
      - name: "SolarEdge SunSpec Model"
        unique_id: solaredge_sunspec_model
        address: 69
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60

      # ==========================================================
      # AC measurements
      # ==========================================================
      - name: "SolarEdge AC Current Raw"
        unique_id: solaredge_ac_current_raw
        address: 71
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Current Scale"
        unique_id: solaredge_ac_current_scale
        address: 75
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Voltage Raw"
        unique_id: solaredge_ac_voltage_raw
        address: 79
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Voltage Scale"
        unique_id: solaredge_ac_voltage_scale
        address: 82
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Power Raw"
        unique_id: solaredge_ac_power_raw
        address: 83
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Power Scale"
        unique_id: solaredge_ac_power_scale
        address: 84
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Frequency Raw"
        unique_id: solaredge_ac_frequency_raw
        address: 85
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge AC Frequency Scale"
        unique_id: solaredge_ac_frequency_scale
        address: 86
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30

      # ==========================================================
      # Apparent power / reactive power / power factor
      # ==========================================================
      - name: "SolarEdge Apparent Power Raw"
        unique_id: solaredge_apparent_power_raw
        address: 87
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Apparent Power Scale"
        unique_id: solaredge_apparent_power_scale
        address: 88
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Reactive Power Raw"
        unique_id: solaredge_reactive_power_raw
        address: 89
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Reactive Power Scale"
        unique_id: solaredge_reactive_power_scale
        address: 90
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Power Factor Raw"
        unique_id: solaredge_power_factor_raw
        address: 91
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge Power Factor Scale"
        unique_id: solaredge_power_factor_scale
        address: 92
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30

      # ==========================================================
      # Lifetime AC energy
      #
      # 93-94 = uint32 accumulated energy
      # 95    = signed scale factor
      # ==========================================================
      - name: "SolarEdge Lifetime Energy Raw"
        unique_id: solaredge_lifetime_energy_raw
        address: 93
        input_type: holding
        data_type: uint32
        slave: 1
#        swap: byte
        scan_interval: 60
      - name: "SolarEdge Lifetime Energy Scale"
        unique_id: solaredge_lifetime_energy_scale
        address: 95
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      # ==========================================================
      # DC measurements
      # ==========================================================
      - name: "SolarEdge DC Current Raw"
        unique_id: solaredge_dc_current_raw
        address: 96
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Current Scale"
        unique_id: solaredge_dc_current_scale
        address: 97
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Voltage Raw"
        unique_id: solaredge_dc_voltage_raw
        address: 98
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Voltage Scale"
        unique_id: solaredge_dc_voltage_scale
        address: 99
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Power Raw"
        unique_id: solaredge_dc_power_raw
        address: 100
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30
      - name: "SolarEdge DC Power Scale"
        unique_id: solaredge_dc_power_scale
        address: 101
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 30

      # ==========================================================
      # Temperature
      # ==========================================================
      - name: "SolarEdge Temperature Raw"
        unique_id: solaredge_temperature_raw
        address: 102
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60
      - name: "SolarEdge Temperature Scale"
        unique_id: solaredge_temperature_scale
        address: 105
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      # ==========================================================
      # Status
      # ==========================================================
      - name: "SolarEdge Status"
        unique_id: solaredge_status
        address: 106
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60
      - name: "SolarEdge Vendor Status"
        unique_id: solaredge_vendor_status
        address: 107
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60

# ==========================================================
# Virtual battery simulation
# ==========================================================
input_number:

  virtual_battery_soc:
    name: Virtual Battery SOC
    min: 10
    max: 100
    step: 0.01
    unit_of_measurement: "%"
    mode: box
    icon: mdi:battery

  virtual_battery_capacity:
    name: Virtual Battery Capacity
    min: 1
    max: 50
    step: 0.1
    initial: 10
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:battery-high

  virtual_battery_max_charge:
    name: Virtual Battery Max Charge
    min: 0.5
    max: 20
    step: 0.1
    initial: 3
    unit_of_measurement: "kW"
    mode: box
    icon: mdi:battery-plus

  virtual_battery_max_discharge:
    name: Virtual Battery Max Discharge
    min: 0.5
    max: 20
    step: 0.1
    initial: 3
    unit_of_measurement: "kW"
    mode: box
    icon: mdi:battery-minus

  virtual_battery_charge_efficiency:
    name: Virtual Battery Charge Efficiency
    min: 50
    max: 100
    step: 0.1
    initial: 95
    unit_of_measurement: "%"
    mode: box
    icon: mdi:battery-arrow-up

  virtual_battery_discharge_efficiency:
    name: Virtual Battery Discharge Efficiency
    min: 50
    max: 100
    step: 0.1
    initial: 95
    unit_of_measurement: "%"
    mode: box
    icon: mdi:battery-arrow-down

# ==========================================================
# Virtual battery energy integration
# ==========================================================
sensor:

  - platform: integration
    source: sensor.virtual_battery_charge_power
    name: Virtual Battery Energy Charged
    unique_id: virtual_battery_energy_charged
    unit_prefix: k
    unit_time: h
    round: 3
    method: trapezoidal
    max_sub_interval:
      minutes: 5

  - platform: integration
    source: sensor.virtual_battery_discharge_power
    name: Virtual Battery Energy Discharged
    unique_id: virtual_battery_energy_discharged
    unit_prefix: k
    unit_time: h
    round: 3
    method: trapezoidal
    max_sub_interval:
      minutes: 5

  - platform: integration
    source: sensor.virtual_grid_import_power
    name: Virtual Grid Import Energy
    unique_id: virtual_grid_import_energy
    unit_prefix: k
    unit_time: h
    round: 3
    method: trapezoidal
    max_sub_interval:
      minutes: 5

  - platform: integration
    source: sensor.virtual_grid_export_power
    name: Virtual Grid Export Energy
    unique_id: virtual_grid_export_energy
    unit_prefix: k
    unit_time: h
    round: 3
    method: trapezoidal
    max_sub_interval:
      minutes: 5

# ==========================================================
# Virtual battery daily energy
# ==========================================================
utility_meter:

  virtual_battery_charge_daily:
    source: sensor.virtual_battery_energy_charged
    name: Virtual Battery Charged Today
    cycle: daily

  virtual_battery_discharge_daily:
    source: sensor.virtual_battery_energy_discharged
    name: Virtual Battery Discharged Today
    cycle: daily

  virtual_grid_import_daily:
    source: sensor.virtual_grid_import_energy
    name: Virtual Grid Import Today
    cycle: daily

  virtual_grid_export_daily:
    source: sensor.virtual_grid_export_energy
    name: Virtual Grid Export Today
    cycle: daily

# Dashboards
lovelace:
  resource_mode: yaml
  dashboards:
    solar-power:
      mode: yaml
      filename: solar-dashboard.yaml
      title: Solar
      icon: mdi:solar-power
      show_in_sidebar: true
    solar-battery:
      mode: yaml
      filename: solar-battery-dashboard.yaml
      title: Solar + Battery
      icon: mdi:battery-solar
      show_in_sidebar: true

# Derived SolarEdge sensors
template: !include solaredge-template.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
