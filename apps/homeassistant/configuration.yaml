# Loads default set of integrations. Do not remove.
default_config:

# HTTP / reverse proxy configuration
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.42.0.0/24

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# SolarEdge SE3000H - SunSpec Modbus TCP diagnostic
modbus:
  - name: solaredge
    type: tcp
    host: 192.168.1.161
    port: 1502
    delay: 100
    timeout: 10
    message_wait_milliseconds: 200

    sensors:

      # ==========================================================
      # Known-good AC registers
      # ==========================================================

      - name: "SolarEdge AC Current Raw"
        unique_id: solaredge_ac_current_raw
        address: 71
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Current Scale"
        unique_id: solaredge_ac_current_sf
        address: 75
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Voltage Raw"
        unique_id: solaredge_ac_voltage_raw
        address: 79
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Voltage Scale"
        unique_id: solaredge_ac_voltage_sf
        address: 82
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Power Raw"
        unique_id: solaredge_ac_power_raw
        address: 83
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Power Scale"
        unique_id: solaredge_ac_power_sf
        address: 84
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Frequency Raw"
        unique_id: solaredge_ac_frequency_raw
        address: 85
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60

      - name: "SolarEdge AC Frequency Scale"
        unique_id: solaredge_ac_frequency_sf
        address: 86
        input_type: holding
        data_type: int16
        slave: 1
        scan_interval: 60

      # ==========================================================
      # Diagnostic registers 87-107
      #
      # Read everything as uint16 so we can see the actual
      # register contents without applying SunSpec types/scales.
      # ==========================================================

      - name: "SE Test 87"
        unique_id: se_test_87
        address: 87
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 60

