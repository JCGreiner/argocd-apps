---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: vault
            chart: vault
            repoURL: https://helm.releases.hashicorp.com
            targetRevision: 0.32.0
            namespace: vault
          - name: cert-manager
            chart: cert-manager
            repoURL: https://charts.jetstack.io
            targetRevision: v1.21.1
            namespace: cert-manager
          - name: rancher
            chart: rancher
            repoURL: https://releases.rancher.com/server-charts/latest
            targetRevision: 2.15.1
            namespace: cattle-system
          - name: woodpecker-ci
            chart: woodpecker
            repoURL: https://woodpecker-ci.org/
            targetRevision: 3.6.4
            namespace: woodpecker
  template:
    metadata:
      name: "{{name}}"
    spec:
      project: default

      sources:
        - repoURL: "{{repoURL}}"
          chart: "{{chart}}"
          targetRevision: "{{targetRevision}}"
          helm:
            valueFiles:
              - $values/platform/{{name}}/values.yaml

        - repoURL: https://github.com/JCGreiner/argocd-apps.git
          targetRevision: main
          ref: values

        - repoURL: https://github.com/JCGreiner/argocd-apps.git
          targetRevision: main
          path: platform/{{name}}/manifests

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

      # 👇 THIS IS THE IMPORTANT FIX
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          name: vault-agent-injector-cfg
          jsonPointers:
            - /webhooks
